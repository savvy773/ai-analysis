[project]
name = "ai-analysis"
version = "0.1.0"
description = "Artificial Analysis·LiveBench 데이터로 AI 모델 비용·시간·코딩 성능을 비교하는 TUI"
requires-python = ">=3.14"
dependencies = [
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.scripts]
ai-analysis = "aa_value:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["aa_value", "aa_data", "aa_style", "aa_tui", "aa_web"]
